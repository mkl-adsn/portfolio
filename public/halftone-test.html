<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halftone Experiment — Leanrada (exact technique)</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f0ede8;
    font-family: system-ui, sans-serif;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    padding: 40px 20px 80px;
  }

  h1 { font-size: 18px; font-weight: 600; }
  h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #888; }

  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 60px;
    align-items: flex-start;
    justify-content: center;
  }

  .demo-card {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: flex-start;
  }

  .demo-frame {
    width: 340px;
    overflow: hidden;
    position: relative;
    border-radius: 18px;
  }

  /* ─── Controls ──────────────────────────────────────────────────────────── */
  .controls {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 340px;
  }
  .control-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .control-row label { width: 80px; font-weight: 500; }
  .control-row input[type=range] { flex: 1; }
  .control-row .val { width: 44px; text-align: right; color: #666; font-variant-numeric: tabular-nums; }

  /* ─── File input ─────────────────────────────────────────────────────────── */
  #file-input-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* ═══════════════════════════════════════════════════════════════════════════
     LEANRADA TECHNIQUE — exact CSS from halftone-demo.js source
     ═══════════════════════════════════════════════════════════════════════════

     Key differences from a naïve implementation:
     1. Dot size  = size × bleed  (gradient radius, not blur amount)
     2. Filter   = brightness(0.5 + bleed×0.3) blur(size×0.1) contrast(1000) blur(0.6px)
                   Two blur passes: first spreads, contrast thresholds, second
                   softens the hard dot edges slightly.
     3. Channels are ROTATED via ::before (+30°) and ::after (–21°) pseudo-elements
        — this avoids moiré by placing C/M/Y/K grids at different angles.
     4. Pseudo-elements are oversized (inset: -30%) to fill corners during rotation.
     5. White border + negative margin trick provides a neutral edge so the blur
        doesn't mix with whatever is behind the element.
     6. Each gradient has THREE stops (color → mid → white) for a softer falloff.
     7. sepia(0.4) on the outer box gives the warm print-like tone.
  ═══════════════════════════════════════════════════════════════════════════ */

  /* ── Outer box — sepia gives the warm print tone ──────────────────────── */
  .halftone-demo-box {
    display: block;
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    filter: sepia(0.4);
  }

  /* ── Shared filter + border trick for both CMY wrapper and K layer ─────── */
  /*
   * margin: -18px / border: 54px white
   *   The border extends 54px beyond the image on all sides (neutral white halo).
   *   margin: -18px pulls it back so only 18px of border is "visible" in the
   *   parent clip — the rest is hidden but gives blur room to work against white
   *   rather than against the page background.
   */
  .halftone-demo,
  .halftone-demo-k-layer {
    --halftone-dot-size:       calc(var(--hs) * var(--hb));
    --halftone-color-dot-size: var(--halftone-dot-size);

    position: relative;
    margin: -18px;
    border: solid 54px #fff;
    overflow: hidden;

    /* brightness: scales with bleed so threshold sits near image midtones
       blur(size×0.1): initial spread
       contrast(1000): hard threshold
       blur(0.6px): tiny anti-alias pass */
    filter:
      brightness(calc(0.5 + var(--hb) * 0.3))
      blur(calc(var(--hs) * 0.1))
      contrast(1000)
      blur(0.6px);
  }

  /* ── CMY image: saturate + slight boost so CMY hues register ───────────── */
  .halftone-demo > .halftone-media {
    display: block;
    width: 100%;
    /* double-invert saturate: boosts saturation without changing hue */
    filter: invert(1) brightness(0.75) invert(1) saturate(2);
  }

  /* ── Ink overlay — screen-blends the dot pattern onto the image ─────────── */
  .halftone-demo-ink {
    position: absolute;
    inset: 0;
    mix-blend-mode: screen;
  }

  /*
   * ::before  rotated +30° — carries Y (yellow) channel
   *           In the non-separate-K variant it also carries 2 K dots;
   *           for separate-K those K entries are removed (see below).
   *
   * Gradient positions within each cell:
   *   Y dots sit at (25%,25%) and (75%,75%) — diagonally offset pair
   *   K dots sit at (25%,75%) and (75%,25%) — other diagonal
   */
  .halftone-demo-ink::before {
    content: "";
    position: absolute;
    inset: -30%;
    background-size: var(--hs) var(--hs);
    background-blend-mode: multiply;
    mix-blend-mode: multiply;
    transform: rotate(30deg);
    background-image:
      /* K channel (black) — removed in separate-K variant */
      radial-gradient(var(--halftone-dot-size)       at 25% 75%, #000, #666, #fff),
      radial-gradient(var(--halftone-dot-size)       at 75% 25%, #000, #666, #fff),
      /* Y channel (yellow) */
      radial-gradient(var(--halftone-color-dot-size) at 25% 25%, #ff0, #ff6, #fff),
      radial-gradient(var(--halftone-color-dot-size) at 75% 75%, #ff0, #ff6, #fff);
  }

  /*
   * ::after   rotated –21° + small X translation — carries C (cyan) and M (magenta)
   *           The translateX(size×0.58) shifts the C/M grid relative to Y/K
   *           so the four channels don't visually stack.
   *
   *   M dots at (75%,25%) and (25%,75%)
   *   C dots at (75%,75%) and (25%,25%)
   */
  .halftone-demo-ink::after {
    content: "";
    position: absolute;
    inset: -30%;
    background-size: var(--hs) var(--hs);
    background-blend-mode: multiply;
    mix-blend-mode: multiply;
    transform: rotate(-21deg) translateX(calc(var(--hs) * 0.58));
    background-image:
      /* M channel (magenta) */
      radial-gradient(var(--halftone-color-dot-size) at 75% 25%, #f0f, #f6f, #fff),
      radial-gradient(var(--halftone-color-dot-size) at 25% 75%, #f0f, #f6f, #fff),
      /* C channel (cyan) */
      radial-gradient(var(--halftone-color-dot-size) at 75% 75%, #0ff, #6ff, #fff),
      radial-gradient(var(--halftone-color-dot-size) at 25% 25%, #0ff, #6ff, #fff);
  }

  /* ── Separate-K variant: remove K from ::before, K handled by k-layer ──── */
  .separate-k .halftone-demo-ink::before {
    background-image:
      radial-gradient(var(--halftone-color-dot-size) at 25% 25%, #ff0, #ff6, #fff),
      radial-gradient(var(--halftone-color-dot-size) at 75% 75%, #ff0, #ff6, #fff);
  }

  /* ── K layer (separate-K only) ──────────────────────────────────────────── */
  .halftone-demo-k-layer {
    display: none;
    position: absolute;
    inset: 0;
    mix-blend-mode: multiply;
  }
  .separate-k .halftone-demo-k-layer {
    display: block;
  }

  /* K image: greyscale + boost so dark areas produce solid K dots */
  .halftone-demo-k-layer > .halftone-media {
    display: block;
    width: 100%;
    filter: grayscale(1) brightness(2);
  }

  /*
   * K dots in ::after of the k-layer.
   * mix-blend-mode: screen on this pseudo-element:
   *   bright image areas → screen pushes above contrast threshold → no dot
   *   dark image areas   → stays dark → dot survives contrast threshold
   * The whole k-layer is multiply-blended onto the CMY result.
   */
  .halftone-demo-k-layer::after {
    content: "";
    position: absolute;
    inset: -30%;
    background-size: var(--hs) var(--hs);
    background-blend-mode: multiply;
    mix-blend-mode: screen;
    transform: rotate(30deg);
    background-image:
      radial-gradient(var(--halftone-color-dot-size) at 25% 25%, #000, #666, #ccc, #fff),
      radial-gradient(var(--halftone-color-dot-size) at 75% 75%, #000, #fff);
  }

  /* ── Original for comparison ─────────────────────────────────────────────── */
  .halftone-original img {
    display: block;
    width: 100%;
  }

</style>
</head>
<body>

<h1>Halftone — Leanrada Exact Technique</h1>

<div id="file-input-wrap">
  <label for="img-file" style="font-weight:600">Test image:</label>
  <input type="file" id="img-file" accept="image/*">
  <span style="color:#888">or default placeholder</span>
</div>

<div class="controls">
  <div class="control-row">
    <label for="s-size">Size</label>
    <input type="range" id="s-size" min="4" max="40" value="12" step="1">
    <span class="val" id="v-size">12px</span>
  </div>
  <div class="control-row">
    <label for="s-bleed">Bleed</label>
    <input type="range" id="s-bleed" min="0.1" max="0.6" value="0.4" step="0.01">
    <span class="val" id="v-bleed">0.40</span>
  </div>
</div>

<div class="row">

  <!-- Variant A: CMYK all-in-one (no separate K) -->
  <div class="demo-card">
    <h2>All CMYK in one block</h2>
    <div class="demo-frame">
      <div class="halftone-demo-box">
        <div class="halftone-demo" id="demo-a">
          <img class="halftone-media" id="img-a" src="/images/case-placeholder-image.png" alt="">
          <div class="halftone-demo-ink"></div>
        </div>
        <div class="halftone-demo-k-layer">
          <img class="halftone-media" id="img-a-k" src="/images/case-placeholder-image.png" alt="">
        </div>
      </div>
    </div>
  </div>

  <!-- Variant B: Separate K -->
  <div class="demo-card">
    <h2>Separate K channel</h2>
    <div class="demo-frame">
      <div class="halftone-demo-box">
        <div class="halftone-demo separate-k" id="demo-b">
          <img class="halftone-media" id="img-b" src="/images/case-placeholder-image.png" alt="">
          <div class="halftone-demo-ink"></div>
        </div>
        <div class="halftone-demo-k-layer">
          <img class="halftone-media" id="img-b-k" src="/images/case-placeholder-image.png" alt="">
        </div>
      </div>
    </div>
  </div>

  <!-- Original -->
  <div class="demo-card">
    <h2>Original</h2>
    <div class="demo-frame">
      <div class="halftone-original">
        <img id="img-orig" src="/images/case-placeholder-image.png" alt="">
      </div>
    </div>
  </div>

</div>

<script>
  function applyVars(size, bleed) {
    document.documentElement.style.setProperty('--hs', size + 'px');
    document.documentElement.style.setProperty('--hb', bleed);
  }

  const sSize  = document.getElementById('s-size');
  const sBleed = document.getElementById('s-bleed');
  const vSize  = document.getElementById('v-size');
  const vBleed = document.getElementById('v-bleed');

  function update() {
    const size  = parseFloat(sSize.value);
    const bleed = parseFloat(sBleed.value);
    vSize.textContent  = size + 'px';
    vBleed.textContent = bleed.toFixed(2);
    applyVars(size, bleed);
  }

  sSize.addEventListener('input', update);
  sBleed.addEventListener('input', update);
  applyVars(12, 0.4);

  document.getElementById('img-file').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    ['img-a', 'img-a-k', 'img-b', 'img-b-k', 'img-orig'].forEach(id => {
      document.getElementById(id).src = url;
    });
  });
</script>

</body>
</html>
